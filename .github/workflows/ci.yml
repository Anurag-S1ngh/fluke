name: Tests and type checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fluke
          POSTGRES_PASSWORD: fluke
          POSTGRES_DB: fluke_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluke -d fluke_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:3001
      DATABASE_URL: postgresql://fluke:fluke@localhost:5432/fluke_test
      REDIS_URL: redis://localhost:6379/1
      RESEND_API_KEY: test-key
      EMAIL_FROM: test@fluke.local
      JWT_SECRET: "00000000000000000000000000000000"
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run db:test:push
      - run: bun run test
      - run: bun run check-types
